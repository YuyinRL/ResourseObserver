version: 1

skills:

* name: update-doc
  trigger: /update-doc
  description: 更新设计文档与更新日志
  steps:

  * 收集变更:

    * git --no-pager log --since="today" --oneline
    * git --no-pager diff --stat
    * 总结: 新增 / 修复 / 变更
  * 更新日志:

    * 文件: docs/designdoc/13-更新日志.md
    * 分类:

      * 新增
      * 修复
      * 变更
    * 添加: [[wikilink]]
  * 同步文档:

    * 条件: 存在架构变更
    * 更新:

      * 05-网络通信.md
      * 06-UI系统.md
      * 07-数据模型.md
      * 08-Web端设计.md
  * 输出:

    * 简要总结今日更新

* name: commit
  trigger: /commit
  description: 汇总并提交所有修改
  steps:

  * 收集变更:

    * git --no-pager diff --stat HEAD
    * 分类: 新增 / 修复 / 变更
  * 暂存:

    * git add -A
  * 生成提交:

    * 来源: docs/designdoc/13-更新日志.md
    * 格式: |
      [v版本号] 更新摘要

      ### 新增

      * ...

      ### 修复

      * ...

      ### 变更

      * ...

      Co-authored-by: Copilot [223556219+Copilot@users.noreply.github.com](mailto:223556219+Copilot@users.noreply.github.com)
  * 提交:

    * git commit
  * 输出:

    * commit hash
    * 文件数量

* name: design
  trigger: /design
  description: 将口语需求转为结构化设计
  output:

  * 功能目标
  * 用户操作
  * 系统行为
  * 模块划分
  * 数据流
  * 类/接口
  * 边界情况
  * 实现建议

* name: debug
  trigger: /debug
  description: 分析报错与异常
  steps:

  * 判断类型:

    * 编译错误
    * 运行异常
    * Gradle
    * Mod加载
    * 前后端
  * 分析原因
  * 给最小修改方案
  * 请求必要信息
    output:
  * 问题类型
  * 原因
  * 关键报错
  * 修改建议

* name: analyze-java
  trigger: /analyze-java
  description: 分析Java类结构
  output:

  * 类职责
  * 方法字段
  * 依赖关系
  * 数据流
  * 问题
  * 重构建议

* name: analyze-gradle
  trigger: /analyze-gradle
  description: 分析Gradle配置
  checks:

  * Java版本
  * Gradle版本
  * 依赖冲突
  * 插件配置
  * mixin配置
    output:
  * 概述
  * 问题
  * 建议
  * 风险

* name: mod-design
  trigger: /mod-design
  description: Minecraft Mod功能设计
  output:

  * 功能
  * 交互
  * 服务端逻辑
  * 客户端逻辑
  * 数据同步
  * 类设计
  * 注册项
  * 边界
  * 实现步骤

* name: next-page
  trigger: /next-page
  description: Next.js页面设计
  output:

  * 页面目标
  * 结构
  * 组件
  * 状态
  * API
  * 交互
  * 错误处理
  * 样式
  * 文件

* name: api-flow
  trigger: /api-flow
  description: API数据流分析
  output:

  * 数据来源
  * 路径
  * 方法
  * 参数
  * 响应
  * 前端使用
  * 后端逻辑
  * 异常
  * 缓存

* name: refactor
  trigger: /refactor
  description: 提供重构建议
  output:

  * 问题
  * 代码异味
  * 拆分点
  * 新结构
  * 步骤
  * 风险
  * 是否值得

rules:

* 不读取整个项目
* 优先局部文件
* 优先git信息
* 信息不足再请求
* 避免大范围扫描
* 输出必须结构化
* 修改前说明影响
* 不确定必须标注

