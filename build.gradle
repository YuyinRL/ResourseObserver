plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // 在此定义 wrapper 属性，避免每次更新 gradlew.properties 时重复设置。
    // 切换为 Wrapper.DistributionType.ALL 会下载包含文档的完整 Gradle 源码（鼠标悬停时可查看注释），
    // 但会增加 Gradle 文件体积。如果切换为 ALL，请随后运行两次 Gradle wrapper 任务。
    // （可检查 gradle/wrapper/gradle-wrapper.properties 确认 distributionUrl 是否指向 `-all`）
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // 包含数据生成器生成的资源
    srcDir('src/generated/resources')

    // 排除仅用于开发阶段的资源文件
    exclude("**/*.bbmodel") // BlockBench 项目文件
    exclude("src/generated/**/.cache") // 数据生成缓存文件
}

repositories {
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "ModMaven"
        url "https://modmaven.dev/"
        content {
            includeGroup "mekanism"
        }
    }
    maven {
        name "IzzelAliz Maven"
        url "https://maven.izzel.io/releases/"
        content {
            includeGroup "icyllis.modernui"
        }
    }
    // 如需额外的依赖仓库，请在此添加
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang 在 1.21.1 向终端用户分发 Java 21，因此 mod 应以 Java 21 为目标版本。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // 指定 NeoForge 版本
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 默认运行配置，可按需调整、删除或复制
    runs {
        client {
            client()

            // 以逗号分隔的游戏测试命名空间列表，留空表示加载所有命名空间
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 速率调试日志：启用后每 12 秒向日志输出 [RateDebug] 统计行
            // 不需要时注释掉此行即可，不影响正常游戏性能
            systemProperty 'resobs.ratedebug', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 此运行配置启动 GameTestServer 并执行所有已注册的游戏测试，然后退出。
        // 默认情况下，如果没有提供游戏测试，服务器会崩溃。
        // 其他运行配置也默认启用游戏测试系统，可通过 /test 命令触发。
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 覆盖上方 configureEach 设置的 workingDirectory 的示例，如需使用请取消注释
            // gameDirectory = project.file('run-data')

            // 指定数据生成的 mod ID、输出目录和现有资源查找位置
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 以下配置应用于所有上述运行配置
        configureEach {
            // 推荐的 userdev 环境日志标记，可按需以逗号分隔添加/移除。
            // "SCAN"：模组扫描  "REGISTRIES"：注册表事件  "REGISTRYDUMP"：获取所有注册表内容
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 推荐的控制台日志级别
            // 参考：https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 定义 mod 与源集的绑定关系，多 mod 项目应为每个 mod 定义一个
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 定义 'localRuntime' 依赖配置。
// 用于声明仅在本地运行测试时需要的“可选”依赖，
// 该依赖不会被传递给下游模组。
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ModernUI 共用排除规则（这些依赖由 Minecraft/NeoForge 运行时提供）
    def modernUiExcludes = { dep ->
        dep.exclude group: "org.slf4j", module: "slf4j-api"
        dep.exclude group: "org.apache.logging.log4j", module: "log4j-core"
        dep.exclude group: "org.apache.logging.log4j", module: "log4j-api"
        dep.exclude group: "com.google.code.findbugs", module: "jsr305"
        dep.exclude group: "org.jetbrains", module: "annotations"
        dep.exclude group: "com.ibm.icu", module: "icu4j"
        dep.exclude group: "it.unimi.dsi", module: "fastutil"
    }

    // ModernUI（NeoForge）
    implementation "icyllis.modernui:ModernUI-NeoForge:${modernui_mc_version}"
    additionalRuntimeClasspath(compileOnly("icyllis.modernui:ModernUI-Core:${modernui_core_version}"), modernUiExcludes)
    additionalRuntimeClasspath(compileOnly("icyllis.modernui:ModernUI-Markflow:${modernui_core_version}"), modernUiExcludes)

    // AE2 API（编译期） + 完整运行时 mod（本地开发测试用）
    compileOnly "org.appliedenergistics:appliedenergistics2:19.2.17:api"
    localRuntime "org.appliedenergistics:appliedenergistics2:19.2.17"
    // Mekanism API（编译期，包含所有模块 API） + 完整运行时 mod（本地开发测试用）
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    // Mekanism Generators 运行时（本地开发测试用）
    localRuntime "mekanism:Mekanism:${mekanism_version}:generators"
    // Flux Networks API（编译期） + 完整运行时 mod（本地开发测试用）
    compileOnly "curse.maven:flux-networks-248020:6089446"
    localRuntime "curse.maven:flux-networks-248020:6089446"
    localRuntime "maven.modrinth:sophisticated-storage:705Gttqj"
    localRuntime "maven.modrinth:sophisticated-core:kA66Nbi1"
    localRuntime "maven.modrinth:functional-storage:sOE4zjiT"
    localRuntime "maven.modrinth:titanium:LmipxHTo"
    // Draconic Evolution + 依赖（本地开发测试用，运行时通过反射访问）
    localRuntime "curse.maven:codechicken-lib-1-8-242818:7281427"
    localRuntime "curse.maven:brandons-core-231382:6769922"
    localRuntime "curse.maven:draconic-evolution-223565:6770008"
}

// 将所有已声明的替换属性展开到指定资源目标中。
// 缺少属性会导致构建错误。属性使用 ${} Groovy 语法展开。
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            modernui_mc_version    : modernui_mc_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// 将 "generateModMetadata" 的输出作为构建的输入目录，
// 同时支持通过 Gradle 和 IDE 构建。
sourceSets.main.resources.srcDir generateModMetadata
// 避免手动运行 "generateModMetadata"，使其在每次项目重新加载时自动执行
neoForge.ideSyncTask generateModMetadata

// Maven 发布配置示例
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Java 编译使用 UTF-8 编码
}

// IDEA 不再自动下载依赖的源码和 Javadoc JAR，因此需要显式启用。
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
